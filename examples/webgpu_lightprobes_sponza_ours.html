<!DOCTYPE html>
<html lang="en">
	<head>
		<title>three.js webgpu - light probe volume (Sponza, ours)</title>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
		<meta property="og:title" content="three.js webgpu - light probe volume (Sponza, ours)">
		<meta property="og:type" content="website">
		<meta property="og:url" content="https://threejs.org/examples/webgpu_lightprobes_sponza.html">
		<meta property="og:image" content="https://threejs.org/examples/screenshots/webgpu_lightprobes_sponza.jpg">
		<link type="text/css" rel="stylesheet" href="main.css">
	</head>
	<body>

		<div id="info">
			<a href="https://threejs.org" target="_blank" rel="noopener">three.js</a> - light probe volume (Sponza, ours)<br/>
			WASD to move, mouse to look &middot; floating sphere = dynamic object lit by the probe grid
		</div>

		<progress id="progressBar" value="0" max="100" style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%)"></progress>

		<script type="importmap">
			{
				"imports": {
					"three": "../build/three.webgpu.js",
					"three/webgpu": "../build/three.webgpu.js",
					"three/tsl": "../build/three.tsl.js",
					"three/addons/": "./jsm/"
				}
			}
		</script>

		<script type="module">

			import * as THREE from 'three/webgpu';

			import { FirstPersonControls } from 'three/addons/controls/FirstPersonControls.js';
			import { GUI } from 'three/addons/libs/lil-gui.module.min.js';
			import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
			import { SkyMesh } from 'three/addons/objects/SkyMesh.js';
			import { LightProbeGridGPU } from 'three/addons/lighting/LightProbeGridGPU.js';

			const MODEL_INDEX_URL = 'https://raw.githubusercontent.com/KhronosGroup/glTF-Sample-Assets/main/Models/model-index.json';
			const SAMPLE_ASSETS_BASE_URL = 'https://raw.githubusercontent.com/KhronosGroup/glTF-Sample-Assets/main/Models/';

			let camera, scene, renderer, controls, timer;
			let probes = null, probesHelper = null;
			let movingSphere = null;
			let sponzaModel = null;
			let modelSize = null;
			let dirLight = null, sky = null;
			let bakeStatus = 'pending';
			let bakeCount = 0;
			let lastBakeError = '';
			const sun = new THREE.Vector3();

			const _box = new THREE.Box3();
			const _size = new THREE.Vector3();
			const _center = new THREE.Vector3();

			init();

			async function init() {

				timer = new THREE.Timer();

				camera = new THREE.PerspectiveCamera( 60, window.innerWidth / window.innerHeight, 0.1, 1000 );
				camera.position.set( - 10.25, 4.99, 0.40 );
				camera.rotation.set( 1.6505, - 1.5008, 1.6507 );

				scene = new THREE.Scene();

				sky = new SkyMesh();
				sky.scale.setScalar( 450000 );
				scene.add( sky );

				sky.turbidity.value = 10;
				sky.rayleigh.value = 2;
				sky.mieCoefficient.value = 0.005;
				sky.mieDirectionalG.value = 0.8;
				sky.cloudSpeed.value = 0; // freeze clouds to match the WebGL example ( time = 0 )

				renderer = new THREE.WebGPURenderer( { antialias: true } );
				renderer.setPixelRatio( Math.min( window.devicePixelRatio, 1.5 ) );
				renderer.setSize( window.innerWidth, window.innerHeight );
				renderer.shadowMap.enabled = true;
				renderer.toneMapping = THREE.ACESFilmicToneMapping;
				renderer.toneMappingExposure = 1.0;
				document.body.appendChild( renderer.domElement );

				await renderer.init();
				renderer.setAnimationLoop( animate );

				controls = new FirstPersonControls( camera, renderer.domElement );
				controls.movementSpeed = 2.0;
				controls.lookSpeed = 0.16;

				const progressBar = document.getElementById( 'progressBar' );

				const manager = new THREE.LoadingManager();
				manager.onProgress = function ( url, loaded, total ) {

					progressBar.value = loaded / total * 100;

				};

				manager.onLoad = function () {

					progressBar.remove();

				};

				const loader = new GLTFLoader( manager );
				const modelURL = await getSponzaModelURL();
				const gltf = await loader.loadAsync( modelURL );
				const model = gltf.scene;
				sponzaModel = model;
				const embeddedLights = [];

				model.traverse( ( child ) => {

					if ( child.isMesh ) {

						child.castShadow = true;
						child.receiveShadow = true;

					} else if ( child.isLight ) {

						embeddedLights.push( child );

					}

				} );

				for ( const light of embeddedLights ) {

					if ( light.parent ) light.parent.remove( light );

				}

				scene.add( model );

				_box.setFromObject( model );
				modelSize = _box.getSize( _size ).clone();
				const modelCenter = _box.getCenter( _center ).clone();
				const targetY = modelCenter.y + modelSize.y * 0.2;
				const lightBaseDistance = Math.max( modelSize.x, modelSize.z );
				const probeFar = Math.max( modelSize.x, modelSize.y, modelSize.z ) * 2.0;
				let rebakeTimer = null;
				let isBaking = false;
				let bakeQueued = false;

				dirLight = new THREE.DirectionalLight( 0xfff2dc, 50.0 );
				dirLight.target.position.set( modelCenter.x, targetY, modelCenter.z );
				scene.add( dirLight.target );
				dirLight.castShadow = true;
				dirLight.shadow.mapSize.setScalar( 2048 );
				const shadowExtent = Math.max( modelSize.x, modelSize.z ) * 0.7;
				dirLight.shadow.camera.left = - shadowExtent;
				dirLight.shadow.camera.right = shadowExtent;
				dirLight.shadow.camera.top = shadowExtent;
				dirLight.shadow.camera.bottom = - shadowExtent;
				dirLight.shadow.camera.near = 0.1;
				dirLight.shadow.camera.far = modelSize.y * 4.0;
				scene.add( dirLight );

				const params = {
					enabled: true,
					showProbes: false,
					probeSize: 0.25,
					boundsX: - 0.5,
					boundsY: 6,
					boundsZ: - 0.3,
					sizeX: 19,
					sizeY: 11,
					sizeZ: 7,
					countX: 7,
					countY: 7,
					countZ: 3,
					lightAzimuth: - 45,
					lightElevation: 55,
					lightIntensity: 50.0,
					probeIntensity: 6.0,
					shadows: true,
					dynamicSphere: true
				};

				// Demo: a dynamic object that travels through the probe volume. Unlike the
				// static Sponza geometry it is NOT baked into the probes — it is lit at runtime
				// by sampling the grid at its current world position, so its shading shifts as it
				// moves. This is the canonical "probes light moving objects" use case.
				movingSphere = new THREE.Mesh(
					new THREE.SphereGeometry( 0.6, 32, 16 ),
					new THREE.MeshStandardMaterial( { color: 0xcccccc, roughness: 0.7, metalness: 0.0 } )
				);
				movingSphere.castShadow = true;
				movingSphere.receiveShadow = true;
				movingSphere.userData.center = new THREE.Vector3( params.boundsX, params.boundsY, params.boundsZ );
				movingSphere.userData.half = new THREE.Vector3( params.sizeX, params.sizeY, params.sizeZ ).multiplyScalar( 0.5 );
				scene.add( movingSphere );

				function updateLightPosition() {

					const azimuth = THREE.MathUtils.degToRad( params.lightAzimuth );
					const elevation = THREE.MathUtils.degToRad( params.lightElevation );
					const radius = lightBaseDistance;
					const horizontal = Math.cos( elevation ) * radius;
					const vertical = Math.sin( elevation ) * radius;

					dirLight.position.set(
						modelCenter.x + Math.cos( azimuth ) * horizontal,
						targetY + vertical,
						modelCenter.z + Math.sin( azimuth ) * horizontal
					);
					dirLight.target.position.set( modelCenter.x, targetY, modelCenter.z );
					dirLight.target.updateMatrixWorld();

					const phi = THREE.MathUtils.degToRad( 90 - params.lightElevation );
					const theta = THREE.MathUtils.degToRad( params.lightAzimuth );
					sun.setFromSphericalCoords( 1, phi, theta );
					sky.sunPosition.value.copy( sun );

				}

				function scheduleRebake() {

					if ( rebakeTimer !== null ) clearTimeout( rebakeTimer );
					rebakeTimer = setTimeout( () => {

						rebakeTimer = null;
						bakeWithSettings();

					}, 250 );

				}

				async function bakeWithSettings() {

					if ( isBaking ) {

						bakeQueued = true;
						return;

					}

					isBaking = true;
					bakeStatus = 'baking';
					lastBakeError = '';

					try {

						do {

							bakeQueued = false;

							// Reuse the grid across re-bakes ( its size is fixed ). Re-baking writes into the
							// existing atlas texture; recreating the grid would destroy a texture still
							// referenced by the lighting pipeline.
							if ( ! probes ) {

								const gridMin = new THREE.Vector3(
									params.boundsX - params.sizeX / 2,
									params.boundsY - params.sizeY / 2,
									params.boundsZ - params.sizeZ / 2
								);
								const gridMax = new THREE.Vector3(
									params.boundsX + params.sizeX / 2,
									params.boundsY + params.sizeY / 2,
									params.boundsZ + params.sizeZ / 2
								);

								probes = new LightProbeGridGPU( gridMin, gridMax, {
									resolution: params.countX,
									cubemapSize: 32,
									projectionPrecision: 'half float',
									probeIntensity: params.probeIntensity,
									normalBias: 0.5,
									viewBias: 0,
									leakReductionMode: 'normal',
									renderer
								} );
								scene.add( probes );

							}

							// Keep the dynamic sphere out of the bake so it isn't burned into the probes.
							if ( movingSphere ) movingSphere.visible = false;

							await probes.bake( renderer, scene, {
								cubemapSize: 32,
								near: 0.05,
								far: probeFar
							} );
							bakeCount ++;
							probes.visible = params.enabled;
							updateProbeMaterialLighting();

							if ( movingSphere ) movingSphere.visible = params.dynamicSphere;

							if ( ! probesHelper ) {

								probesHelper = probes.createHelper();
								probesHelper.visible = params.showProbes;
								scene.add( probesHelper );

							} else {

								probesHelper.visible = params.showProbes;

							}

						} while ( bakeQueued );

						bakeStatus = 'ready';

					} catch ( error ) {

						bakeStatus = 'failed';
						lastBakeError = error instanceof Error ? error.message : String( error );
						throw error;

					} finally {

						if ( movingSphere ) movingSphere.visible = params.dynamicSphere;
						isBaking = false;

					}

				}

				function updateProbeMaterialLighting() {

					if ( probes === null ) return;

					const gridLightsNode = probes.createLightsNode( [ dirLight ] );
					const applyMaterial = material => {

						material.lightsNode = gridLightsNode;
						material.needsUpdate = true;

					};

					if ( sponzaModel !== null ) {

						sponzaModel.traverse( child => {

							if ( child.isMesh !== true || child.material === undefined ) return;
							if ( Array.isArray( child.material ) ) {

								for ( const material of child.material ) applyMaterial( material );

							} else {

								applyMaterial( child.material );

							}

						} );

					}

					if ( movingSphere?.material !== undefined ) applyMaterial( movingSphere.material );

				}

				updateLightPosition();

				const gui = new GUI();
				gui.add( params, 'enabled' ).name( 'GI' ).onChange( ( value ) => {

					if ( probes ) probes.visible = value;

				} );

				gui.add( params, 'dynamicSphere' ).name( 'Dynamic Sphere' ).onChange( ( value ) => {

					if ( movingSphere ) movingSphere.visible = value;

				} );

				gui.add( params, 'lightAzimuth', - 180, 180, 1 ).name( 'Light Azimuth' ).onChange( () => {

					updateLightPosition();
					scheduleRebake();

				} );
				gui.add( params, 'lightElevation', 5, 85, 1 ).name( 'Light Elevation' ).onChange( () => {

					updateLightPosition();
					scheduleRebake();

				} );
				gui.add( params, 'lightIntensity', 0, 50, 0.1 ).name( 'Light Intensity' ).onChange( ( value ) => {

					dirLight.intensity = value;
					scheduleRebake();

				} );
				gui.add( params, 'probeIntensity', 0, 32, 0.5 ).name( 'Probe Intensity' ).onChange( ( value ) => {

					if ( probes ) probes.probeIntensity.value = value;

				} );
				gui.add( params, 'shadows' ).name( 'Shadows' ).onChange( ( value ) => {

					setShadowsEnabled( value );
					scheduleRebake();

				} );

				gui.add( params, 'showProbes' ).name( 'Show Probes' ).onChange( ( value ) => {

					if ( probesHelper ) probesHelper.visible = value;

				} );
				gui.add( params, 'probeSize', 0.05, 2.0, 0.05 ).name( 'Probe Size' ).onChange( () => {

					if ( probesHelper ) {

						scene.remove( probesHelper );
						probesHelper.dispose();
						probesHelper = probes.createHelper();
						probesHelper.visible = params.showProbes;
						scene.add( probesHelper );

					}

				} );

				gui.add( { log: () => {

					console.log( 'position:', camera.position.x.toFixed( 2 ), camera.position.y.toFixed( 2 ), camera.position.z.toFixed( 2 ) );
					console.log( 'rotation:', camera.rotation.x.toFixed( 4 ), camera.rotation.y.toFixed( 4 ), camera.rotation.z.toFixed( 4 ) );

				} }, 'log' ).name( 'Log Camera' );

				function installTestHarness() {

					if ( new URLSearchParams( window.location.search ).has( 'testHarness' ) === false ) return;

					const sampleProbe = new THREE.Vector3();

					window.__webgpuLightProbeGridSponzaControl = {
						async waitUntilReady() {

							if ( bakeStatus === 'failed' ) throw new Error( lastBakeError || 'LightProbeGridGPU bake failed.' );

							while ( bakeStatus !== 'ready' ) {

								await new Promise( resolve => setTimeout( resolve, 50 ) );

							}

						},
						getMetrics() {

							const resolution = probes ? probes.resolution : null;
							const probeCount = Number.isFinite( resolution ) ? resolution ** 3 : 0;

							return {
								implementation: 'ours-sponza',
								status: bakeStatus,
								bakeError: lastBakeError,
								bakeCount,
								isLightProbeGrid: probes?.isLightProbeGrid === true,
								hasTexture: probes?.texture !== null,
								hasBoundingBox: probes?.boundingBox !== undefined,
								resolution: Number.isFinite( resolution ) ? resolution : 0,
								size: probes ? [ params.sizeX, params.sizeY, params.sizeZ ] : [ 0, 0, 0 ],
								position: probes ? [ params.boundsX, params.boundsY, params.boundsZ ] : [ 0, 0, 0 ],
								probeCount
							};

						},
						inspectProbePositions() {

							const resolution = probes.resolution;
							const samples = [
								0,
								probes.totalProbes - 1,
								Math.floor( probes.totalProbes / 2 )
							].map( ( probeIndex ) => {

								probes.getProbePosition( probeIndex, sampleProbe );

								return {
									index: [
										probeIndex % resolution,
										Math.floor( probeIndex / resolution ) % resolution,
										Math.floor( probeIndex / ( resolution * resolution ) )
									],
									position: [ sampleProbe.x, sampleProbe.y, sampleProbe.z ]
								};

							} );

							return { samples };

						},
						async rebake() {

							await bakeWithSettings();

						},
						setDisplayOptions( options = {} ) {

							if ( options.probesEnabled !== undefined ) {

								params.enabled = options.probesEnabled === true;
								if ( probes ) probes.visible = params.enabled;
								if ( probes ) probes.probeIntensity.value = params.enabled ? params.probeIntensity : 0;

							}

							if ( options.showProbes !== undefined ) {

								params.showProbes = options.showProbes === true;
								if ( probesHelper ) probesHelper.visible = params.showProbes;

							}

						}
					};

				}

				setShadowsEnabled( params.shadows );
				await bakeWithSettings();
				installTestHarness();

				window.addEventListener( 'resize', onWindowResize );

			}

			async function getSponzaModelURL() {

				const response = await fetch( MODEL_INDEX_URL );
				const models = await response.json();
				const sponzaInfo = models.find( ( model ) => model.name === 'Sponza' );

				if ( ! sponzaInfo ) {

					throw new Error( 'Sponza entry was not found in the glTF sample model index.' );

				}

				const variants = sponzaInfo.variants || {};
				const variantName = variants[ 'glTF-Binary' ] || variants[ 'glTF' ] || variants[ 'glTF-Embedded' ] || Object.values( variants )[ 0 ];

				if ( ! variantName ) {

					throw new Error( 'Sponza has no supported glTF variant in the model index.' );

				}

				const variantFolder = variantName.endsWith( '.glb' ) ? 'glTF-Binary' : 'glTF';
				return `${ SAMPLE_ASSETS_BASE_URL }${ sponzaInfo.name }/${ variantFolder }/${ variantName }`;

			}

			function setShadowsEnabled( enabled ) {

				if ( ! renderer || ! dirLight ) return;

				renderer.shadowMap.enabled = enabled;
				dirLight.castShadow = enabled;

			}

			function onWindowResize() {

				camera.aspect = window.innerWidth / window.innerHeight;
				camera.updateProjectionMatrix();

				renderer.setSize( window.innerWidth, window.innerHeight );

			}

			function animate( timestamp ) {

				timer.update( timestamp );
				controls.update( timer.getDelta() );

				if ( movingSphere !== null && movingSphere.visible ) {

					const t = timer.getElapsed();
					const { center, half } = movingSphere.userData;

					// Sweep along the corridor (X) and bob up/down (Y), staying inside the probe
					// volume so the lookup always interpolates real probes.
					movingSphere.position.set(
						center.x + Math.sin( t * 0.6 ) * half.x * 0.7,
						center.y + Math.sin( t * 1.5 ) * half.y * 0.55,
						center.z
					);

				}

				renderer.render( scene, camera );

			}

		</script>
	</body>
</html>
